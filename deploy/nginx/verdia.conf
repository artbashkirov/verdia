# Production nginx-конфиг для ai-verdia.ru.
#
# Применяется на VPS как `/etc/nginx/sites-available/verdia`
# (см. `docs/migration-blue-green.md`, шаг 8).
#
# Архитектура:
# - upstream verdia_app — два инстанса (verdia-blue:3000 + verdia-green:3002),
#   nginx балансирует между ними и прозрачно перекидывает на здоровый
#   при падении одного через `proxy_next_upstream` (failover за один запрос).
# - error_page 502/503/504 → /502.html — брендированная страница на случай,
#   если оба upstream'а недоступны (теоретически возможно только при
#   падении всей VPS).
# - /api/health — отдельный location, БЕЗ `proxy_intercept_errors`, чтобы
#   JS на странице 502 не путался: иначе ответ от error_page показал бы
#   страницу 502 как «здоровый» сервис, и был бы reload-loop. У этого
#   location СВОЙ proxy_next_upstream — иначе при падении одного из
#   инстансов health тоже отдавал бы 502 (этим страдала первая версия).
#
# Все Certbot-блоки (SSL-сертификаты, редиректы http→https) сохранены
# один-в-один с предыдущей версией конфига — Certbot их продолжит
# обновлять автоматически.
#
# Что НЕ включено и почему:
# - keepalive в upstream — конфликтует с `Connection 'upgrade'` для
#   WebSocket и ломает failover. У нас нет WebSocket-трафика
#   (Supabase Realtime ходит на свой домен), поэтому отказались.
# - `proxy_set_header Connection 'upgrade'` / `Upgrade $http_upgrade` —
#   убраны вместе с keepalive по той же причине: нет WS-фич, требующих
#   их. Если в будущем добавим WS — вернём оба, но без keepalive.

upstream verdia_app {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;
}

server {
    server_name ai-verdia.ru www.ai-verdia.ru;

    # Кастомные страницы для случая, когда оба upstream'а недоступны.
    error_page 502 503 504 /502.html;

    # Сама страница 502 — отдаётся напрямую с диска, не через proxy.
    # `internal` запрещает прямой запрос пользователем по URL `/502.html`.
    location = /502.html {
        root /var/www/verdia;
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Health-check без перехвата ошибок — иначе JS на странице 502
    # уйдёт в петлю reload (см. комментарий в начале файла).
    # Свой `proxy_next_upstream` — иначе при падении одного инстанса
    # health отдавал бы 502 несмотря на failover в основном location.
    location = /api/health {
        proxy_pass http://verdia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
        proxy_intercept_errors off;
        access_log off;
    }

    # Основной proxy с автоматическим failover между blue и green.
    location / {
        proxy_pass http://verdia_app;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_intercept_errors on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-verdia.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-verdia.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ai-verdia.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ai-verdia.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ai-verdia.ru www.ai-verdia.ru;
    return 404; # managed by Certbot
}
