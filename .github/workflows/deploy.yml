name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # Сначала проверяем что код собирается без ошибок
  build-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Деплой только после успешной проверки билда
  deploy:
    runs-on: ubuntu-latest
    needs: build-check  # Ждём успешного завершения build-check
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/verdia-app
            git pull origin main
            npm install --production=false
            npm run build
            # reload вместо restart — graceful shutdown:
            # PM2 шлёт SIGINT, ждёт корректного завершения текущих реквестов,
            # потом стартует новый процесс. В fork-mode это всё ещё короткий
            # простой (1–5 сек), но мягче, чем restart.
            # Для полностью zero-downtime — см. docs/backlog.md → Zero-downtime deploy.
            pm2 reload verdia --update-env
            pm2 save
            # Health-check: ждём, пока новый процесс реально начнёт отвечать.
            # Если не поднялся за 30 сек — фейлим деплой, чтобы это было видно
            # в Actions, а не висело молча.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
                echo "Healthcheck OK on attempt $i"
                exit 0
              fi
              sleep 1
            done
            echo "Healthcheck FAILED — /api/health не ответил на :3000 за 30 сек"
            pm2 logs verdia --lines 50 --nostream || true
            exit 1
