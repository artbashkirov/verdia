name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # Сначала проверяем что код собирается без ошибок
  build-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Деплой только после успешной проверки билда
  deploy:
    runs-on: ubuntu-latest
    needs: build-check  # Ждём успешного завершения build-check
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/verdia-app
            git pull origin main
            npm install --production=false
            npm run build
            pm2 restart verdia --update-env
            pm2 save
